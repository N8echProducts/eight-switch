<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eight-Switch Binary Trainer</title>
  </head>
  <body>
    <header>
      <h1>Eight-Switch <span>Binary Trainer</span></h1>
      <div class="connection">
        <span id="status" class="status"></span>
        <button id="connect">Connect Eight-Switch</button>
      </div>
    </header>
    <section class="switches-panel">
      <div id="switches" class="switches"></div>
      <div class="readout">
        <span id="readout-bin"></span>
        <span id="send-indicator" class="send-indicator" title="Send button">SEND</span>
      </div>
      <p id="input-hint" class="input-hint"></p>
    </section>
    <nav id="tabs" class="tabs"></nav>
    <main id="mode" class="mode"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
